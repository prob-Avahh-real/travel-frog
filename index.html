<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8dcc0">
<title>旅行青蛙 · 旅かえる</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ========== 顶部状态 ========== -->
  <header id="hud">
    <div class="hud-group">
      <span class="chip" id="chip-clover" title="三叶草"><span class="ico" id="ico-clover"></span><b id="num-clover">0</b></span>
      <span class="chip" id="chip-fourleaf" title="四叶草（出门必得好照片）"><span class="ico" id="ico-fourleaf"></span><b id="num-fourleaf">0</b></span>
    </div>
    <div class="hud-title" id="hud-title">独自旅行的青蛙</div>
    <div class="hud-group">
      <button class="hud-btn hidden" id="btn-motion" title="开启体感（智能戒指 / 手杖）">⌚</button>
      <button class="hud-btn" id="btn-speed" title="快进（测试用）">⏩</button>
      <button class="hud-btn" id="btn-menu" title="更多">⋯</button>
    </div>
  </header>

  <!-- ========== 主舞台 ========== -->
  <main id="stage">
    <section class="screen" data-screen="home" id="screen-home">
      <div class="room" id="room">
        <div class="wall">
          <div class="window" id="room-window">
            <div class="win-sky" id="win-sky"></div>
            <div class="win-hill"></div>
            <div class="win-pane"></div>
          </div>
          <div class="picture"><div class="pic-inner"></div></div>
          <div class="shelf">
            <span class="book b1"></span><span class="book b2"></span><span class="book b3"></span>
            <span class="jar"></span>
          </div>
          <div class="lamp-hang"></div>
        </div>
        <div class="floor">
          <div class="rug"></div>
          <div class="bed"><div class="bed-blanket"></div><div class="bed-pillow"></div></div>
          <div class="desk"><div class="desk-top"></div><div class="desk-leg l"></div><div class="desk-leg r"></div></div>
          <div class="frog-host" id="frog-host"></div>
          <div class="bubble hidden" id="frog-bubble">发呆</div>
          <div class="visitor-spot hidden" id="visitor-spot" title="点它喂点特产">
            <div class="snail"><div class="snail-shell"></div><div class="snail-body"></div><div class="snail-eye l"></div><div class="snail-eye r"></div></div>
            <span class="v-label">点我</span>
          </div>
        </div>
        <div class="away-panel hidden" id="away-panel">
          <div class="away-inner">
            <div class="away-emoji">🎒</div>
            <div class="away-text" id="away-text"></div>
            <div class="away-bar"><i id="away-fill"></i></div>
            <div class="away-sub" id="away-sub"></div>
          </div>
        </div>
      </div>

      <div class="strip">
        <div class="strip-head">
          <span>三叶草田</span>
          <button class="mini-btn" id="btn-harvest-all">一键收割</button>
        </div>
        <div class="garden" id="garden"></div>
      </div>

      <div class="strip bag-strip" id="bag-strip"></div>

      <div class="strip">
        <div class="strip-head"><span>最近动态</span><button class="mini-btn" id="go-log">全部</button></div>
        <div class="log" id="home-log"></div>
      </div>
    </section>

    <section class="screen hidden" data-screen="shop" id="screen-shop">
      <div class="seg" id="shop-seg">
        <button class="seg-btn on" data-kind="food">便当</button>
        <button class="seg-btn" data-kind="item">道具</button>
      </div>
      <p class="hint" id="shop-hint"></p>
      <div class="list" id="shop-list"></div>
    </section>

    <section class="screen hidden" data-screen="bag" id="screen-bag">
      <p class="hint">给青蛙准备一个便当（+ 最多 3 件道具）。便当越贵，走得越远、回来得越少。</p>
      <h3 class="sec">便当</h3>
      <div class="list" id="bag-food"></div>
      <h3 class="sec">道具 <small>（出发时消耗）</small></h3>
      <div class="list grid" id="bag-item"></div>
      <div class="bag-foot">
        <div class="bag-preview" id="bag-preview"></div>
        <button class="primary" id="btn-depart" disabled>出发</button>
      </div>
    </section>

    <section class="screen hidden" data-screen="album" id="screen-album">
      <p class="hint">明信片册：青蛙每回来一次都会带回一张照片。</p>
      <div class="album" id="album-grid"></div>
    </section>

    <section class="screen hidden" data-screen="stuff" id="screen-stuff">
      <p class="hint">特产可以卖掉换三叶草，也可以喂门口来的蜗牛换回礼。</p>
      <div class="list" id="stuff-list"></div>
    </section>

    <section class="screen hidden" data-screen="log" id="screen-log">
      <p class="hint">青蛙的日常记录。</p>
      <div class="log" id="log-list"></div>
    </section>
  </main>

  <!-- ========== 底部标签 ========== -->
  <nav id="tabs">
    <button class="tab on" data-tab="home"><span>🏠</span>家</button>
    <button class="tab" data-tab="shop"><span>🏪</span>商店</button>
    <button class="tab" data-tab="bag"><span>🎒</span>行囊</button>
    <button class="tab" data-tab="album"><span>📮</span>图鉴<em id="album-badge"></em></button>
    <button class="tab" data-tab="stuff"><span>🧺</span>特产</button>
    <button class="tab" data-tab="log"><span>📓</span>日记</button>
  </nav>
</div>

<div id="toasts"></div>
<div id="visitor-banner" class="hidden">🐌 蜗牛来门口等你了 —— 点它喂点特产</div>
<div id="modal" class="hidden"><div class="modal-box" id="modal-box"></div></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
