<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd0ef">
<title>御风启程</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/flight.css">
</head>
<body>
<!-- 新手引导：摇铃 → 登机 → 滑翔。从状态推导、可跳过（跳过写档） -->
<div class="guide hidden" id="guide">
  <div class="guide-dim"></div>
  <div class="guide-ring" id="guide-ring"></div>
  <div class="guide-slip" id="guide-slip">
    <span id="guide-tip"></span>
    <button class="guide-skip" id="guide-skip" aria-label="跳过新手引导">跳过</button>
  </div>
</div>
<div id="app">

  <!-- ===================== 满屏场景 ===================== -->
  <div id="stage">
    <div id="scene-wrap">
      <div id="scene"></div>
      <div id="sky-layers" class="hidden">
        <div class="lay lay-bg" id="lay-bg"></div>
        <div class="lay" id="lay-far"></div>
        <div class="lay" id="lay-mid"></div>
        <div class="lay" id="lay-near"></div>
      </div>
      <div id="mount-box" class="hidden"></div>
      <div id="flight-fx"></div>
      <div id="scene-hits"></div>
    </div>

    <!-- 顶部：三叶草计数片 + 摇铃 + 菜单 -->
    <div class="hud-top">
      <div class="chip-clover">
        <span class="leaf-ico" id="ico-clover"></span>
        <b id="num-clover">0</b>
      </div>
      <button class="bell-btn hidden" id="btn-bell" title="摇铃召唤坐骑" aria-label="摇铃召唤坐骑">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 a6 6 0 0 1 6 6 c0 3 1.5 4 2 5.5 H4 c .5 -1.5 2 -2.5 2 -5.5 a6 6 0 0 1 6 -6 Z"/>
          <path d="M10 19 a2.5 2.5 0 0 0 4 0"/>
        </svg>
      </button>
      <div class="hud-spacer"></div>
      <button class="chip-menu" id="btn-menu" title="菜单" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M5 8 h14 M5 12 h14 M5 16 h10"/>
        </svg>
      </button>
    </div>

    <!-- 飞行 HUD：航迹仪（航线 + 风矢标里程） -->
    <div id="flight-hud" class="hidden">
      <div class="fh-track"><i id="flight-prog"></i></div>
      <div class="fh-dist">
        <svg viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M2 12 V2 M2 2 L8 5 M2 7 L6 9"/>
        </svg>
        <span id="flight-dist">0 米</span>
      </div>
      <div class="fh-hint hidden" id="glide-hint">按住上下拖动</div>
    </div>

    <!-- 相位横幅 -->
    <div id="phase-banner" class="hidden"></div>
  </div>

  <!-- ===================== 菜单面板 ===================== -->
  <section class="sheet sheet-menu hidden" id="sheet-menu">
    <button class="back-btn" data-close="1">返回</button>
    <h2 class="sheet-title">菜单</h2>
    <div class="menu-card" id="menu-status"></div>
  </section>
</div>

<div id="slips"></div>
<div id="modal" class="hidden"><div class="modal-box" id="modal-box"></div></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/scene.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
